[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlheal"
version = "0.1.0"
description = "SQLHeal: Clause-level Diagnosis and Targeted Self-Healing for Text-to-SQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=25.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

